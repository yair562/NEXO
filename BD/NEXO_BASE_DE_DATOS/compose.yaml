# NEXO: PostgreSQL + PostgREST. Valores en .env (copia de .env.example; ver README).
name: nexo

services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    networks:
      - nexo_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Falta POSTGRES_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Falta POSTGRES_SUPERUSER_PASSWORD en .env}
      # Las lee docker/postgres/init/01_roles.sh al crear los roles.
      NEXO_MIGRATOR_PASSWORD: ${NEXO_MIGRATOR_PASSWORD:?Falta NEXO_MIGRATOR_PASSWORD en .env}
      NEXO_APP_PASSWORD: ${NEXO_APP_PASSWORD:?Falta NEXO_APP_PASSWORD en .env}
      PGRST_AUTHENTICATOR_PASSWORD: ${PGRST_AUTHENTICATOR_PASSWORD:?Falta PGRST_AUTHENTICATOR_PASSWORD en .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    volumes:
      - nexo_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Solo en 127.0.0.1: lo necesita la app PHP de XAMPP, que corre fuera de Docker.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    networks:
      - nexo_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexión interna por el nombre del servicio; nunca con el superusuario.
      PGRST_DB_URI: postgres://authenticator:${PGRST_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?Falta PGRST_JWT_SECRET en .env}
      PGRST_SERVER_PORT: 3000
      # Servidor de administración: /live (proceso vivo) y /ready (conectado a PostgreSQL).
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_DB_MAX_ROWS: 500
    # La imagen de PostgREST no trae shell ni curl, así que no admite healthcheck interno:
    # scripts/check_connection.ps1 consulta /ready desde el equipo.
    ports:
      - "127.0.0.1:${POSTGREST_HOST_PORT:-3000}:3000"
      - "127.0.0.1:${POSTGREST_ADMIN_HOST_PORT:-3001}:3001"

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nexo_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "false"
      FLASK_PORT: 5000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      DATABASE_USER: nexo_app
      DATABASE_PASSWORD: ${NEXO_APP_PASSWORD:?Falta NEXO_APP_PASSWORD en .env}
      SECRET_KEY: ${NEXO_FLASK_SECRET_KEY:-}
      SESSION_MINUTES: ${NEXO_SESSION_MINUTES:-60}
      INSTITUTIONAL_EMAIL_DOMAIN: ${INSTITUTIONAL_EMAIL_DOMAIN:-huixquilucan.tecnm.mx}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      AUTH_DEV_CODE_OUTPUT: ${AUTH_DEV_CODE_OUTPUT:-false}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  nexo_pgdata:

networks:
  nexo_network:
    name: nexo_network
